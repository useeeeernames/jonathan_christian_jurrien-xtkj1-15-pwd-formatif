<!--
Perhitungan lebar kartu tanpa box-sizing:
320px + 20px + 20px + 2px + 2px = 364px
-->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }
        main {
            padding: 20px;
        }
        .card {
            width: 320px;
            padding: 20px;
            border: 2px solid #dddddd;
            margin: 30px auto;
            border-radius: 12px;
            background-color: white;
        }
        .card img {
            width: 100%;
            height: 160px;
            display: block;
            object-fit: cover;
        }
        .card h3 {
            color: #222222;
            margin-bottom: 8px;
        }
        .card p {
            font-size: 15px;
            line-height: 1.6;
            color: #555555;
        }
        .card a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
        footer {
            text-align: center;
            padding: 20px;
        }
        footer a {
            color: #333333;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <div class="card">
            <img src="../assets/images/project.jpg" alt="Gambar Proyek">
            <h3>Website Portofolio</h3>
            <p>
                Proyek ini merupakan website portfolio sederhana
                yang dibuat menggunakan HTML dan CSS.
                Tujuannya adalah menampilkan informasi dan hasil
                pekerjaan dalam sebuah halaman website.
            </p>
            <a>Lihat Proyek</a>
        </div>
    </main>
    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>
</body>
</html>
