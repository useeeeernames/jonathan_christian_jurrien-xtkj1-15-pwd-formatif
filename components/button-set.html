
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Set</title>
    <style>
        body {
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }
        h2 {
            color: #222222;
            font-size: 20px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }
        .button-group .btn {
            margin-right: 10px;
            margin-bottom: 10px;
        }
        .btn-primary {
            background-color: blue;
            color: white;
        }
        .btn-secondary {
            background-color: #ffbf00;
        }
        .btn-outline {
            background-color: white;
            border: 2px solid rgb(50, 50, 50);
        }
        .btn-send {
            background-color: rgba(40, 167, 69, 0.9);
            color: white;
        }
        .btn-secondary,
        .btn-outline {
            color: #222222;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary:hover {
            background-color: orange;
        }
        .btn-outline:hover {
            background-color: #dddddd;
        }
        .btn-send:hover {
            background-color: rgb(20, 120, 50);
        }
    </style>
</head>
<body>
    <main>
        <h2>Judul Bagian</h2>
        <div class="button-group">
            <a class="btn btn-primary">Lihat Proyek</a>
            <a class="btn btn-secondary">Unduh CV</a>
            <a class="btn btn-outline">Hubungi Saya</a>
            <a class="btn btn-send">Kirim Pesan</a>
        </div>
    </main>
    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>
</body>
</html>
